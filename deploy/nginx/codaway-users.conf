# ==============================================================================
# Codaway Users Portal - Nginx Reverse Proxy Configuration
# 域名: codaway-users.13dot8billion.site
# 部署路径推荐: /etc/nginx/conf.d/codaway-users.conf (或 /etc/nginx/sites-available/)
# 静态资源: /codaway/homepage/
# API 转发: http://127.0.0.1:8787 (codaway-pipe)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name codaway-users.13dot8billion.site;

    # 静态网站根目录（由 artifacts/build home 投递）
    root /codaway/homepage;
    index index.html;

    # 客户端上传限制与超时
    client_max_body_size 50M;

    # Gzip 压缩支持
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 日志输出
    access_log /var/log/nginx/codaway-users.access.log;
    error_log /var/log/nginx/codaway-users.error.log;

    # 1. 静态前端页面路由 (支持 clean URLs，自动匹配 /register.html, /roadmap.html)
    location / {
        try_files $uri $uri/ $uri.html /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # 2. API 接口反向代理至同机器的 codaway-pipe 进程 (:8787)
    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # 透传真实客户端 IP，供 Pipe 的邮件验证码滑动窗口进行防御拦截
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 支持（无需全局 map，直接透传客户端协议头）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # 3. 健康检查路由
    location /health {
        proxy_pass http://127.0.0.1:8787/health;
        access_log off;
    }
}
