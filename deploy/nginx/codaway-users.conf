# ==============================================================================
# Codaway Users Portal - Nginx Reverse Proxy Configuration
# 域名: codaway-users.13dot8billion.site
# 部署路径推荐: /etc/nginx/conf.d/codaway-users.conf (或 /etc/nginx/sites-available/)
# 静态资源: /codaway/homepage/
# API 转发: http://127.0.0.1:8787 (codaway-pipe)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name codaway-users.13dot8billion.site;

    # Only the local cloudflared process may supply Cloudflare client addresses.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # 静态网站根目录（由 scripts/build home 投递）
    root /codaway/homepage;
    index index.html;

    # 客户端上传限制与超时
    client_max_body_size 50M;

    # Gzip 压缩支持
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 日志输出
    access_log /var/log/nginx/codaway-users.access.log;
    error_log /var/log/nginx/codaway-users.error.log;

    # 1. 静态页面入口（HTML 不长期缓存，以便即时获取最新带哈希的资源引用）
    location / {
        try_files $uri $uri/ $uri.html /index.html;
        add_header Cache-Control "no-cache";
    }

    # 1.1 带内容哈希的构建静态资源（1 年强缓存 immutable）
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 1.2 避免浏览器默认请求 /favicon.ico 回退到 index.html 并被边缘误缓存
    location = /favicon.ico {
        return 204;
        access_log off;
        log_not_found off;
    }

    # 2. API 接口反向代理至同机器的 codaway-pipe 进程 (:8787)
    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # 透传真实客户端 IP，供 Pipe 的邮件验证码滑动窗口进行防御拦截
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 支持（无需全局 map，直接透传客户端协议头）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # 3. 健康检查路由
    location /health {
        proxy_pass http://127.0.0.1:8787/health;
        access_log off;
    }
}
